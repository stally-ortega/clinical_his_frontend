@if (toastService.toasts().length > 0) {
  <div class="toast-container" aria-live="polite" aria-atomic="true">
    @for (toast of toastService.toasts(); track toast.id) {
      <div class="toast-item" [class.toast-item--error]="toast.type === 'error'" [class.toast-item--success]="toast.type === 'success'">
        <span class="toast-message">{{ toast.message }}</span>
        <button type="button" class="toast-close" (click)="toastService.remove(toast.id)" aria-label="Cerrar notificación">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    }
  </div>
}
